spring:
  datasource:
    url: "jdbc:h2:mem:nutrisedb;MODE=MySQL;NON_KEYWORDS=USER;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  mail:
    username: test@example.invalid
    password: test-password
    test-connection: false

jwt:
  secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  expiration: 3600000

openrouter:
  api:
    key: test-disabled

usda:
  api:
    key: test-disabled

app:
  scheduling:
    enabled: false

  cors:
    allowed-origin-patterns: "http://localhost:*"

logging:
  level:
    root: WARN
    com.example.nutritionsporttracker: INFO
