spring:
  application:
    name: nutrition-sport-tracker

  jackson:
    time-zone: Europe/Istanbul

  lifecycle:
    timeout-per-shutdown-phase: 20s

  sql:
    init:
      mode: never

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

openrouter:
  model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  temperature: ${OPENROUTER_TEMPERATURE:0.6}
  http_referer: ${OPENROUTER_HTTP_REFERER:http://localhost:8080}
  x_title: ${OPENROUTER_X_TITLE:NutritionSportTracker}

usda:
  base-url: https://api.nal.usda.gov/fdc

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
