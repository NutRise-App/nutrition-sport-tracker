services:
  mysql:
    image: mysql:8.0.36
    container_name: nutrise-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beslenme_db}
      MYSQL_USER: ${MYSQL_USER:-nutrise}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      TZ: Europe/Istanbul
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - nutrise-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nutrise-backend:local
    container_name: nutrise-backend
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      DEV_DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-beslenme_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Istanbul"
      DEV_DB_USERNAME: ${MYSQL_USER:-nutrise}
      DEV_DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      APP_SCHEDULING_ENABLED: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-disabled}
      USDA_API_KEY: ${USDA_API_KEY:-disabled}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

      # RabbitMQ: Spring Boot bağlantı ayarları
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}

      # RabbitMQ: yayın onayı ve yönlendirme kontrolü
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      SPRING_RABBITMQ_TEMPLATE_MANDATORY: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - nutrise-network

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: nutrise-rabbitmq
    hostname: nutrise-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - nutrise-network

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  nutrise-network:
    driver: bridge